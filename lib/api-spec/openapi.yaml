    post:
      operationId: importContacts
      tags: [sending]
      summary: Import contacts for the authenticated tenant
      description: Accepts validated JSON contact rows or a UTF-8 CSV file; reports invalid, duplicate, and over-quota rows.
      parameters:
        - name: listIds
          in: query
          required: false
          description: Assign imported CSV contacts to these contact lists owned by the authenticated tenant. Repeat the parameter once per list.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
        - name: listId
          in: query
          required: false
          deprecated: true
          description: Legacy single-list selection. Use listIds to assign contacts to multiple lists.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactImportInput"
          text/csv:
            schema:
              $ref: "#/components/schemas/ContactCsvInput"
      responses:
        "200":
          description: Import results for the submitted JSON batch or CSV file
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ContactImportResult"
                  - $ref: "#/components/schemas/ContactImportResponse"
        "400":
          description: Malformed import request or invalid contact list selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An active subscription is required to add contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The CSV exceeds the configured upload size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: CSV import is disabled or the uploaded media type is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
