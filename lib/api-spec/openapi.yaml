openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Multi-tenant email SaaS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: sending
  - name: profile
  - name: admin
  - name: settings
  - name: billing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with username or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Sign-in temporarily limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a tenant account and send email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Verification instructions sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Application email is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/verify-email:
    post:
      operationId: verifyRegistrationEmail
      tags: [auth]
      summary: Verify a registration email with a one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a password reset link without revealing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Generic response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a one-time reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204":
          description: Signed out
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed; other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid password or current password mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /profile:
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update the authenticated user's profile and username/email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          description: Username or email is already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dashboard:
    get:
      operationId: getUserDashboard
      tags: [dashboard]
      summary: Get tenant dashboard summary
      responses:
        "200":
          description: Tenant dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDashboard"
  /sending/settings:
    get:
      operationId: getTenantSendingSettings
      tags: [sending]
      summary: Get the authenticated tenant's sending identity
      responses:
        "200":
          description: Tenant SMTP sending settings without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingSettings"
    put:
      operationId: updateTenantSendingSettings
      tags: [sending]
      summary: Save the authenticated tenant's SMTP sending identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSendingSettingsInput"
      responses:
        "200":
          description: Saved settings; a test send is required after changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingSettings"
        "400":
          description: Invalid sender settings or missing SMTP credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/settings/test:
    post:
      operationId: testTenantSendingSettings
      tags: [sending]
      summary: Send a test message using the tenant's own SMTP credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSendingTestInput"
      responses:
        "200":
          description: Test email accepted by the tenant's SMTP server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingTestResponse"
        "400":
          description: Sender settings are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Tenant SMTP test send failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contacts:
    get:
      operationId: listContacts
      tags: [sending]
      summary: List contacts and quota for the authenticated tenant
      responses:
        "200":
          description: Tenant contacts, list memberships, and current quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactCollection"
    post:
      operationId: createContact
      tags: [sending]
      summary: Add a contact to the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Invalid contact or list membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An active subscription is required to add contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The contact already exists or the contact quota is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contacts/{contactId}:
    parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateContact
      tags: [sending]
      summary: Update a contact owned by the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Invalid contact update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This email already exists in the tenant's contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteContact
      tags: [sending]
      summary: Delete a contact owned by the authenticated tenant
      responses:
        "204":
          description: Contact deleted
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contact-lists:
    get:
      operationId: listContactLists
      tags: [sending]
      summary: List contact lists belonging to the authenticated tenant
      responses:
        "200":
          description: Tenant contact lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactList"
    post:
      operationId: createContactList
      tags: [sending]
      summary: Create a contact list for the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactListInput"
      responses:
        "201":
          description: Contact list created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
        "409":
          description: A list with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contact-lists/{listId}:
    parameters:
      - name: listId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateContactList
      tags: [sending]
      summary: Rename or activate a contact list owned by the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactListUpdate"
      responses:
        "200":
          description: Updated contact list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
        "404":
          description: Contact list not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A list with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteContactList
      tags: [sending]
      summary: Delete a contact list owned by the authenticated tenant
      responses:
        "204":
          description: Contact list deleted
        "404":
          description: Contact list not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [sending]
      summary: List campaigns belonging to the authenticated tenant
      responses:
        "200":
          description: Tenant campaigns with persisted delivery outcomes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignSummary"
    post:
      operationId: createCampaign
      tags: [sending]
      summary: Create a draft campaign for one of the tenant's contact lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Draft campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSummary"
        "400":
          description: Invalid campaign or tenant-owned list required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /campaigns/{campaignId}:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCampaign
      tags: [sending]
      summary: Edit a draft campaign owned by the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated draft campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSummary"
        "400":
          description: Invalid campaign update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Only draft campaigns can be edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCampaign
      tags: [sending]
      summary: Delete a draft campaign owned by the authenticated tenant
      responses:
        "204":
          description: Draft campaign deleted
        "404":
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Only draft campaigns can be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /campaigns/{campaignId}/send:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: sendCampaign
      tags: [sending]
      summary: Queue a tenant campaign for worker-based delivery
      responses:
        "202":
          description: Campaign queued for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSummary"
        "400":
          description: Sender identity, list, or campaign is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Campaign cannot be sent in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Tenant campaign or size limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get platform administration summary
      responses:
        "200":
          description: Admin dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Search and paginate tenant accounts
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, inactive, pending]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
  /admin/users/{userId}/status:
    patch:
      operationId: updateAdminUserStatus
      tags: [admin]
      summary: Activate or deactivate a tenant account
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusInput"
      responses:
        "200":
          description: Account status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /admin/users/{userId}:
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Soft-delete a tenant account
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Account deleted
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [settings]
      summary: Get platform configuration
      responses:
        "200":
          description: Current platform configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
    put:
      operationId: updateAdminSettings
      tags: [settings]
      summary: Update platform configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSettingsInput"
      responses:
        "200":
          description: Updated platform configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
  /admin/settings/email:
    get:
      operationId: getApplicationEmailSettings
      tags: [settings]
      summary: Get masked application SMTP configuration
      responses:
        "200":
          description: Masked app SMTP configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEmailSettings"
    put:
      operationId: updateApplicationEmailSettings
      tags: [settings]
      summary: Save application SMTP configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationEmailSettingsInput"
      responses:
        "200":
          description: Masked updated app SMTP configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEmailSettings"
  /admin/settings/email/test:
    post:
      operationId: sendApplicationEmailTest
      tags: [settings]
      summary: Send a test message using the application SMTP account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailInput"
      responses:
        "200":
          description: Test email result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /admin/billing/razorpay:
    get:
      operationId: getRazorpaySettings
      tags: [billing]
      summary: Get masked sandbox and production Razorpay configuration
      responses:
        "200":
          description: Masked credentials and the active Razorpay environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RazorpaySettings"
    put:
      operationId: updateRazorpaySettings
      tags: [billing]
      summary: Save Razorpay credentials for one environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RazorpaySettingsInput"
      responses:
        "200":
          description: Masked Razorpay configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RazorpaySettings"
  /admin/billing/razorpay/active:
    put:
      operationId: setActiveRazorpayEnvironment
      tags: [billing]
      summary: Select the active Razorpay environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveRazorpayEnvironmentInput"
      responses:
        "200":
          description: Updated active environment and masked credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RazorpaySettings"
  /admin/billing/razorpay/test:
    post:
      operationId: testRazorpayConnection
      tags: [billing]
      summary: Verify saved Razorpay API credentials for one environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestRazorpayConnectionInput"
      responses:
        "200":
          description: Razorpay API connection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RazorpayTestResponse"
  /admin/billing/packages:
    get:
      operationId: listAdminSubscriptionPackages
      tags: [billing]
      summary: List all subscription packages for administration
      responses:
        "200":
          description: Subscription package catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPackageList"
    post:
      operationId: createSubscriptionPackage
      tags: [billing]
      summary: Create a subscription package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPackageInput"
      responses:
        "201":
          description: Created subscription package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPackage"
  /admin/billing/packages/{packageId}:
    patch:
      operationId: updateSubscriptionPackage
      tags: [billing]
      summary: Update a subscription package
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPackageUpdateInput"
      responses:
        "200":
          description: Updated subscription package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPackage"
  /subscriptions/packages:
    get:
      operationId: listAvailableSubscriptionPackages
      tags: [billing]
      summary: List packages available to the authenticated customer
      responses:
        "200":
          description: Purchasable subscription packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPackageList"
  /subscriptions/current:
    get:
      operationId: getCurrentSubscription
      tags: [billing]
      summary: Get the authenticated customer's current subscription
      responses:
        "200":
          description: Current subscription, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSubscription"
  /subscriptions/orders:
    post:
      operationId: createSubscriptionOrder
      tags: [billing]
      summary: Create a server-priced Razorpay order for a package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionOrderInput"
      responses:
        "201":
          description: Razorpay order and Checkout details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionOrderCreated"
  /subscriptions/verify:
    post:
      operationId: verifyRazorpayPayment
      tags: [billing]
      summary: Verify a Checkout response and confirm captured payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRazorpayPaymentInput"
      responses:
        "200":
          description: Payment verification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerificationResult"
  /webhooks/razorpay:
    post:
      operationId: receiveRazorpayWebhook
      tags: [billing]
      summary: Receive signed Razorpay payment events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RazorpayWebhookPayload"
      responses:
        "200":
          description: Webhook accepted or safely ignored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required: [error]
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
