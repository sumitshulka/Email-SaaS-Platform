  /admin/finance/payments:
    get:
      operationId: listAdminFinancePayments
      tags: [admin]
      summary: Search, summarize, and paginate successful customer payments
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 160 }
        - name: packageId
          in: query
          schema: { type: string, format: uuid }
        - name: fromDate
          in: query
          description: Inclusive UTC calendar date for capture time.
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        - name: toDate
          in: query
          description: Inclusive UTC calendar date for capture time.
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        - name: status
          in: query
          schema:
            type: string
            enum: [captured, refunded, all]
            default: captured
        - name: currency
          in: query
          schema: { type: string, pattern: "^[A-Z]{3}$" }
        - name: minAmountMinor
          in: query
          description: Inclusive minimum amount in the selected currency's smallest unit.
          schema: { type: integer, minimum: 0, maximum: 2147483647 }
        - name: maxAmountMinor
          in: query
          description: Inclusive maximum amount in the selected currency's smallest unit.
          schema: { type: integer, minimum: 0, maximum: 2147483647 }
        - name: environment
          in: query
          schema:
            type: string
            enum: [sandbox, production, unrecorded]
        - name: accountStatus
          in: query
          schema:
            type: string
            enum: [any, active, disabled, deleted]
            default: any
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [capturedAt, account, subscription, amount]
            default: capturedAt
        - name: sortDirection
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: A filtered page of customer payments and currency-specific totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFinancePaymentPage"
        "400":
          description: Invalid filter or pagination value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
