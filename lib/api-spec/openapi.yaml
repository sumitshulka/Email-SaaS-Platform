        "200":
          description: Saved Google OAuth setup status without the client secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthSettings"
  /admin/settings/google-oauth/test:
    post:
      operationId: testGoogleOAuthSettings
      tags: [settings]
