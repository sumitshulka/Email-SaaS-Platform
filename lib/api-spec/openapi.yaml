            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
    put:
      operationId: updateAdminSettings
      tags: [settings]
      summary: Update platform configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSettingsInput"
      responses:
        "200":
          description: Updated platform configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
  /admin/settings/email:
    get:
      operationId: getApplicationEmailSettings
      tags: [settings]
      summary: Get masked application SMTP configuration
      responses:
        "200":
          description: Masked app SMTP configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEmailSettings"
    put:
      operationId: updateApplicationEmailSettings
      tags: [settings]
      summary: Save application SMTP configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationEmailSettingsInput"
      responses:
        "200":
          description: Masked updated app SMTP configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationEmailSettings"
  /admin/settings/google-oauth:
    get:
      operationId: getGoogleOAuthSettings
      tags: [settings]
      summary: Get masked Google OAuth configuration
      responses:
        "200":
          description: Google OAuth setup status without the client secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthSettings"
    put:
      operationId: updateGoogleOAuthSettings
      tags: [settings]
      summary: Save Google OAuth credentials and callback URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleOAuthSettingsInput"
