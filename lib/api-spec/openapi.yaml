openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Multi-tenant email SaaS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: sending
  - name: profile
  - name: admin
  - name: settings
  - name: billing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /maintenance/status:
    get:
      operationId: getMaintenanceStatus
      tags: [settings]
      summary: Get public maintenance status
      description: Returns only whether the application is currently in maintenance mode.
      responses:
        "200":
          description: Current maintenance status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with username or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Sign-in temporarily limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Sign-in is limited to superadmins during maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a tenant account and send email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Verification instructions sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Application email is not configured or registration is paused for maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/verify-email:
    post:
      operationId: verifyRegistrationEmail
      tags: [auth]
      summary: Verify a registration email with a one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a password reset link without revealing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Generic response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          description: Password reset requests are temporarily rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Password reset email service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a one-time reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
  /auth/password-policy:
    get:
      operationId: getPasswordPolicy
      tags: [auth]
      summary: Get the current password minimum length
      responses:
        "200":
          description: Password requirements configured by the platform administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordPolicy"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204":
          description: Signed out
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed; other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid password or current password mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /profile:
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update the authenticated user's profile and username/email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          description: Username or email is already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dashboard:
    get:
      operationId: getUserDashboard
      tags: [dashboard]
      summary: Get tenant dashboard summary
      responses:
        "200":
          description: Tenant dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDashboard"
  /notifications:
    get:
      operationId: getUserNotifications
      tags: [notifications]
      summary: List active unread notifications and read history for the authenticated account
      responses:
        "200":
          description: Notifications for the authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotificationsResponse"
  /notifications/{notificationId}/read:
    post:
      operationId: markUserNotificationRead
      tags: [notifications]
      summary: Mark an active notification as read for the authenticated account
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Notification read state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotificationReadResponse"
        "404":
          description: Notification is not available to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /support/tickets:
    get:
      operationId: listSupportTickets
      tags: [support]
      summary: List support tickets for the authenticated customer
      responses:
        "200":
          description: Customer support tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketCollection"
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Open a support ticket with an initial message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketInput"
      responses:
        "201":
          description: Created support ticket and conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"
  /support/tickets/{ticketId}:
    get:
      operationId: getSupportTicket
      tags: [support]
      summary: Get a support ticket owned by the authenticated customer
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Support ticket and conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /support/tickets/{ticketId}/messages:
    post:
      operationId: replyToSupportTicket
      tags: [support]
      summary: Add a customer reply to a support ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketMessageInput"
      responses:
        "200":
          description: Updated support ticket and conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/settings:
    get:
      operationId: getTenantSendingSettings
      tags: [sending]
      summary: Get the authenticated tenant's sending identity
      responses:
        "200":
          description: Tenant SMTP sending settings without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingSettings"
    put:
      operationId: updateTenantSendingSettings
      tags: [sending]
      summary: Save the authenticated tenant's SMTP sending identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSendingSettingsInput"
      responses:
        "200":
          description: Saved settings; a test send is required after changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingSettings"
        "400":
          description: Invalid sender settings or missing SMTP credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/accounts:
    get:
      operationId: listTenantSendingAccounts
      tags: [sending]
      summary: List SMTP sender accounts and the authenticated tenant's package allowance
      responses:
        "200":
          description: SMTP sender accounts without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingAccounts"
    post:
      operationId: createTenantSendingAccount
      tags: [sending]
      summary: Create an SMTP sender account within the tenant's package allowance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSendingSettingsInput"
      responses:
        "201":
          description: SMTP sender account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingAccountResponse"
        "409":
          description: The package sender-account limit has been reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/accounts/{accountId}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTenantSendingAccount
      tags: [sending]
      summary: Update an SMTP sender account owned by the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSendingSettingsInput"
      responses:
        "200":
          description: Updated SMTP sender account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingAccountResponse"
        "404":
          description: SMTP sender account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteTenantSendingAccount
      tags: [sending]
      summary: Delete an SMTP sender account not used by an active campaign
      responses:
        "204":
          description: SMTP sender account deleted
        "404":
          description: SMTP sender account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: SMTP sender account is still used by an active campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/accounts/{accountId}/primary:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setPrimaryTenantSendingAccount
      tags: [sending]
      summary: Make an SMTP sender account the default for campaigns without an explicit sender
      responses:
        "200":
          description: Primary SMTP sender account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingAccountResponse"
        "404":
          description: SMTP sender account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/settings/test:
    post:
      operationId: testTenantSendingSettings
      tags: [sending]
      summary: Send a test message using the tenant's current SMTP settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSendingTestInput"
      responses:
        "200":
          description: Test email accepted by the tenant's SMTP server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingTestResponse"
        "400":
          description: Sender settings are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Tenant SMTP test send failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/settings/connection-test:
    post:
      operationId: testTenantSendingConnection
      tags: [sending]
      summary: Verify the tenant's current SMTP connection without sending email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSendingConnectionTestInput"
      responses:
        "200":
          description: SMTP connection and authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingConnectionTestResponse"
        "400":
          description: Sender settings or SMTP credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Tenant SMTP connection check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingConnectionTestFailure"
  /sending/gmail/connection:
    get:
      operationId: getGmailMailboxConnection
      tags: [sending]
      summary: Get Gmail bounce-monitoring connection and sync health
      responses:
        "200":
          description: OAuth setup and mailbox sync status without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailMailboxConnection"
    delete:
      operationId: disconnectGmailMailbox
      tags: [sending]
      summary: Disconnect the tenant's authorized Gmail mailbox
      responses:
        "204":
          description: Mailbox disconnected and stored refresh token removed
  /sending/gmail/rescan:
    post:
      operationId: rescanRecentGmailMessages
      tags: [sending]
      summary: Rescan a bounded recent Gmail window for delivery-status reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GmailRecentRescanInput"
      responses:
        "200":
          description: Scan counts for the bounded recent-message window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailRecentRescanResult"
        "400":
          description: The recovery window is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Gmail authorization expired and must be renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No Gmail mailbox is connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A regular sync or another recent scan is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The recent-message scan exceeded its safety limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Gmail could not complete the recent-message scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/gmail/connect:
    post:
      operationId: startGmailMailboxConnection
      tags: [sending]
      summary: Start least-privilege Gmail OAuth consent for the tenant mailbox
      responses:
        "200":
          description: Google OAuth authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailOAuthStart"
        "503":
          description: Google OAuth application settings are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/gmail/oauth/callback:
    get:
      operationId: completeGmailMailboxConnection
      tags: [sending]
      summary: Complete the tenant's Google OAuth authorization
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect back to sending settings with a connection result
  /sending/microsoft-365/connection:
    get:
      operationId: getMicrosoft365TraceConnection
      tags: [sending]
      summary: Get tenant-authorized Microsoft 365 trace connection and sync health
      responses:
        "200":
          description: Connection health and authenticated source metadata without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft365TraceConnection"
    delete:
      operationId: disconnectMicrosoft365Trace
      tags: [sending]
      summary: Disconnect Microsoft 365 trace collection for the authenticated tenant
      responses:
        "204":
          description: Credentials and queued trace work removed; imported evidence is retained
  /sending/microsoft-365/connect:
    post:
      operationId: connectMicrosoft365Trace
      tags: [sending]
      summary: Verify tenant-admin-authorized Microsoft 365 message-trace access
      description: SMTP credentials do not authorize trace access. This app-only connection requires an Entra application with ExchangeMessageTrace.Read.All application permission and tenant admin consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Microsoft365TraceConnectInput"
      responses:
        "200":
          description: Microsoft Graph accepted a permission-checked trace request and a 90-day backfill was scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft365TraceConnection"
        "400":
          description: Invalid tenant or application credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Missing Exchange trace permission, tenant admin consent, or trace service-principal setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Disconnect the current tenant before switching to a different one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Microsoft identity or trace service could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/microsoft-365/sync:
    post:
      operationId: triggerMicrosoft365TraceSync
      tags: [sending]
      summary: Schedule an immediate Microsoft 365 trace sync
      responses:
        "200":
          description: Tenant sync has been queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft365TraceConnection"
        "404":
          description: No Microsoft 365 trace connection exists for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A tenant sync is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/microsoft-365/backfill:
    post:
      operationId: backfillMicrosoft365Traces
      tags: [sending]
      summary: Schedule a Microsoft 365 trace backfill
      description: Backfill start dates must be within the provider's rolling 90-day retention window. Requests are split into provider-supported windows of at most 10 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Microsoft365TraceBackfillInput"
      responses:
        "200":
          description: Backfill checkpoint reset and scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft365TraceConnection"
        "400":
          description: Backfill range is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No Microsoft 365 trace connection exists for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A tenant sync is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contacts:
    get:
      operationId: listContacts
      tags: [sending]
      summary: Return a filtered page of contacts and quota for the authenticated tenant
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
        - in: query
          name: status
          schema: { type: string, enum: [all, subscribed, unsubscribed], default: all }
        - in: query
          name: listId
          schema: { type: string, maxLength: 64 }
        - in: query
          name: companyId
          schema: { type: string, maxLength: 64 }
        - in: query
          name: lifecycleStage
          schema: { type: string, maxLength: 80 }
        - in: query
          name: leadStatus
          schema: { type: string, maxLength: 80 }
        - in: query
          name: leadSource
          schema: { type: string, maxLength: 120 }
        - in: query
          name: addedWithin
          schema: { type: string, enum: [any, "7", "30", "90"], default: any }
        - in: query
          name: includeHistory
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: One page of tenant contacts, pagination totals, and current quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactCollection"
    post:
      operationId: createContact
      tags: [sending]
      summary: Add a contact to the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Invalid contact or list membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An active subscription is required to add contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The contact already exists or the contact quota is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contacts/export:
    post:
      operationId: exportContacts
      tags: [sending]
      summary: Stream a tenant contact report as an Excel workbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactExportInput"
      responses:
        "200":
          description: Excel workbook containing the selected contact columns and rows
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400":
          description: Invalid export options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contacts/options:
    get:
      operationId: listContactOptions
      tags: [sending]
      summary: Return a bounded set of contacts for a picker
      parameters:
        - in: query
          name: search
