openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Multi-tenant email SaaS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: sending
  - name: profile
  - name: admin
  - name: settings
  - name: billing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with username or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Sign-in temporarily limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a tenant account and send email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Verification instructions sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Application email is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/verify-email:
    post:
      operationId: verifyRegistrationEmail
      tags: [auth]
      summary: Verify a registration email with a one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a password reset link without revealing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Generic response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          description: Password reset requests are temporarily rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Password reset email service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a one-time reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204":
          description: Signed out
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed; other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid password or current password mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /profile:
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update the authenticated user's profile and username/email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          description: Username or email is already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dashboard:
    get:
      operationId: getUserDashboard
      tags: [dashboard]
      summary: Get tenant dashboard summary
      responses:
        "200":
          description: Tenant dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDashboard"
  /notifications:
    get:
      operationId: getUserNotifications
      tags: [notifications]
      summary: List active unread notifications and read history for the authenticated account
      responses:
        "200":
          description: Notifications for the authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotificationsResponse"
  /notifications/{notificationId}/read:
    post:
      operationId: markUserNotificationRead
      tags: [notifications]
      summary: Mark an active notification as read for the authenticated account
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Notification read state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotificationReadResponse"
        "404":
          description: Notification is not available to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /support/tickets:
    get:
      operationId: listSupportTickets
      tags: [support]
      summary: List support tickets for the authenticated customer
      responses:
        "200":
          description: Customer support tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketCollection"
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Open a support ticket with an initial message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketInput"
      responses:
        "201":
          description: Created support ticket and conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"
  /support/tickets/{ticketId}:
    get:
      operationId: getSupportTicket
      tags: [support]
      summary: Get a support ticket owned by the authenticated customer
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Support ticket and conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /support/tickets/{ticketId}/messages:
    post:
      operationId: replyToSupportTicket
      tags: [support]
      summary: Add a customer reply to a support ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketMessageInput"
      responses:
        "200":
          description: Updated support ticket and conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/settings:
    get:
      operationId: getTenantSendingSettings
      tags: [sending]
      summary: Get the authenticated tenant's sending identity
      responses:
        "200":
          description: Tenant SMTP sending settings without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingSettings"
    put:
      operationId: updateTenantSendingSettings
      tags: [sending]
      summary: Save the authenticated tenant's SMTP sending identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSendingSettingsInput"
      responses:
        "200":
          description: Saved settings; a test send is required after changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingSettings"
        "400":
          description: Invalid sender settings or missing SMTP credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/settings/test:
    post:
      operationId: testTenantSendingSettings
      tags: [sending]
      summary: Send a test message using the tenant's current SMTP settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSendingTestInput"
      responses:
        "200":
          description: Test email accepted by the tenant's SMTP server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingTestResponse"
        "400":
          description: Sender settings are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Tenant SMTP test send failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/settings/connection-test:
    post:
      operationId: testTenantSendingConnection
      tags: [sending]
      summary: Verify the tenant's current SMTP connection without sending email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSendingConnectionTestInput"
      responses:
        "200":
          description: SMTP connection and authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingConnectionTestResponse"
        "400":
          description: Sender settings or SMTP credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Tenant SMTP connection check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSendingConnectionTestFailure"
  /sending/gmail/connection:
    get:
      operationId: getGmailMailboxConnection
      tags: [sending]
      summary: Get Gmail bounce-monitoring connection and sync health
      responses:
        "200":
          description: OAuth setup and mailbox sync status without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailMailboxConnection"
    delete:
      operationId: disconnectGmailMailbox
      tags: [sending]
      summary: Disconnect the tenant's authorized Gmail mailbox
      responses:
        "204":
          description: Mailbox disconnected and stored refresh token removed
  /sending/gmail/connect:
    post:
      operationId: startGmailMailboxConnection
      tags: [sending]
      summary: Start least-privilege Gmail OAuth consent for the tenant mailbox
      responses:
        "200":
          description: Google OAuth authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailOAuthStart"
        "503":
          description: Google OAuth application settings are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/gmail/oauth/callback:
    get:
      operationId: completeGmailMailboxConnection
      tags: [sending]
      summary: Complete the tenant's Google OAuth authorization
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect back to sending settings with a connection result
  /sending/microsoft-365/connection:
    get:
      operationId: getMicrosoft365TraceConnection
      tags: [sending]
      summary: Get tenant-authorized Microsoft 365 trace connection and sync health
      responses:
        "200":
          description: Connection health and authenticated source metadata without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft365TraceConnection"
    delete:
      operationId: disconnectMicrosoft365Trace
      tags: [sending]
      summary: Disconnect Microsoft 365 trace collection for the authenticated tenant
      responses:
        "204":
          description: Credentials and queued trace work removed; imported evidence is retained
  /sending/microsoft-365/connect:
    post:
      operationId: connectMicrosoft365Trace
      tags: [sending]
      summary: Verify tenant-admin-authorized Microsoft 365 message-trace access
      description: SMTP credentials do not authorize trace access. This app-only connection requires an Entra application with ExchangeMessageTrace.Read.All application permission and tenant admin consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Microsoft365TraceConnectInput"
      responses:
        "200":
          description: Microsoft Graph accepted a permission-checked trace request and a 90-day backfill was scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft365TraceConnection"
        "400":
          description: Invalid tenant or application credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Missing Exchange trace permission, tenant admin consent, or trace service-principal setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Disconnect the current tenant before switching to a different one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Microsoft identity or trace service could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/microsoft-365/sync:
    post:
      operationId: triggerMicrosoft365TraceSync
      tags: [sending]
      summary: Schedule an immediate Microsoft 365 trace sync
      responses:
        "200":
          description: Tenant sync has been queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft365TraceConnection"
        "404":
          description: No Microsoft 365 trace connection exists for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A tenant sync is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sending/microsoft-365/backfill:
    post:
      operationId: backfillMicrosoft365Traces
      tags: [sending]
      summary: Schedule a Microsoft 365 trace backfill
      description: Backfill start dates must be within the provider's rolling 90-day retention window. Requests are split into provider-supported windows of at most 10 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Microsoft365TraceBackfillInput"
      responses:
        "200":
          description: Backfill checkpoint reset and scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft365TraceConnection"
        "400":
          description: Backfill range is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No Microsoft 365 trace connection exists for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A tenant sync is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contacts:
    get:
      operationId: listContacts
      tags: [sending]
      summary: Return a filtered page of contacts and quota for the authenticated tenant
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
        - in: query
          name: status
          schema: { type: string, enum: [all, subscribed, unsubscribed], default: all }
        - in: query
          name: listId
          schema: { type: string, maxLength: 64 }
        - in: query
          name: companyId
          schema: { type: string, maxLength: 64 }
        - in: query
          name: lifecycleStage
          schema: { type: string, maxLength: 80 }
        - in: query
          name: leadStatus
          schema: { type: string, maxLength: 80 }
        - in: query
          name: leadSource
          schema: { type: string, maxLength: 120 }
        - in: query
          name: addedWithin
          schema: { type: string, enum: [any, "7", "30", "90"], default: any }
        - in: query
          name: includeHistory
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: One page of tenant contacts, pagination totals, and current quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactCollection"
  /contacts/export:
    post:
      operationId: exportContacts
      tags: [sending]
      summary: Stream a tenant contact report as an Excel workbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactExportInput"
      responses:
        "200":
          description: Excel workbook containing the selected contact columns and rows
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400":
          description: Invalid export options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contacts/options:
    get:
      operationId: listContactOptions
      tags: [sending]
      summary: Return a bounded set of contacts for a picker
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - in: query
          name: listId
          schema: { type: string, maxLength: 64 }
        - in: query
          name: excludeListId
          schema: { type: string, maxLength: 64 }
        - in: query
          name: companyId
          schema: { type: string, maxLength: 64 }
        - in: query
          name: subscribed
          schema: { type: boolean }
        - in: query
          name: listIds
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        "200":
          description: A bounded page of matching contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactOptionsResponse"
        "400":
          description: Invalid picker filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /contacts/filter-options:
    get:
      operationId: getContactFilterOptions
      tags: [sending]
      summary: Return distinct CRM filter values for the authenticated tenant
      responses:
        "200":
          description: Available lifecycle stages, lead statuses, and lead sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactFilterOptions"
    post:
      operationId: createContact
      tags: [sending]
      summary: Add a contact to the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Invalid contact or list membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An active subscription is required to add contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The contact already exists or the contact quota is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /companies/export:
    post:
      operationId: exportCompanies
      tags: [contacts]
      summary: Stream a tenant company report as an Excel workbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyExportInput"
      responses:
        "200":
          description: Excel workbook containing the selected company columns and rows
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400":
          description: Invalid export options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /companies:
    get:
      operationId: listCompanies
      tags: [contacts]
      summary: List companies and their linked-contact counts for the authenticated tenant
      responses:
        "200":
          description: Tenant-owned company records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyCollection"
    post:
      operationId: createCompany
      tags: [contacts]
      summary: Create a company record for the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Invalid company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A company with this domain already exists in the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /companies/search:
    get:
      operationId: searchCompanies
      tags: [contacts]
      summary: Search a bounded page of company names and domains for the authenticated tenant
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 200, default: "" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 40 }
      responses:
        "200":
          description: Matching company selector options and the total number of matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySearchResults"
        "400":
          description: Invalid company search or pagination values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /companies/backfill:
    post:
      operationId: backfillCompanyProfiles
      tags: [contacts]
      summary: Move safely matched legacy contact company profiles into shared company records
      responses:
        "200":
          description: Backfill result; ambiguous and incomplete profiles remain on contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyBackfillResult"
  /companies/unlinked-profiles:
    get:
      operationId: listUnlinkedCompanyProfiles
      tags: [contacts]
      summary: List legacy company profiles that remain unlinked for the authenticated tenant
      responses:
        "200":
          description: Unlinked contact company profiles and the reason each needs review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlinkedCompanyProfileCollection"
  /companies/{companyId}:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCompany
      tags: [contacts]
      summary: Get a company and its linked contacts
      responses:
        "200":
          description: Company profile and associated contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetail"
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCompany
      tags: [contacts]
