          description: Invalid or unavailable provider model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Provider connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: Provider connection timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAIProviderSettings
      tags: [settings]
      summary: Remove the saved LLM provider, encrypted key, and selected model
      responses:
        "200":
          description: Unconfigured LLM provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProviderSettings"
        "403":
          description: Superadmin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/settings/ai-provider/test:
    post:
      operationId: testAIProviderConnection
      tags: [settings]
      summary: Test an LLM API key and list available text-generation models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestAIProviderConnectionInput"
      responses:
        "200":
          description: Provider connection result and available models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProviderTestResult"
        "400":
          description: Invalid provider or API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Provider connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: Provider connection timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/settings/email/test:
    post:
      operationId: sendApplicationEmailTest
      tags: [settings]
      summary: Send a test message using the application SMTP account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailInput"
      responses:
        "200":
          description: Test email result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /admin/billing/razorpay:
    get:
      operationId: getRazorpaySettings
      tags: [billing]
      summary: Get masked sandbox and production Razorpay configuration
      responses:
        "200":
          description: Masked credentials and the active Razorpay environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RazorpaySettings"
    put:
      operationId: updateRazorpaySettings
      tags: [billing]
      summary: Save Razorpay credentials for one environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RazorpaySettingsInput"
      responses:
        "200":
          description: Masked Razorpay configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RazorpaySettings"
  /admin/billing/online-payments:
    get:
      operationId: getOnlinePaymentSettings
      tags: [billing]
      summary: Get the online payment availability switch
      responses:
        "200":
          description: Online payment availability and last update time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlinePaymentSettings"
    put:
      operationId: updateOnlinePaymentSettings
      tags: [billing]
      summary: Enable or disable new online payment checkouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnlinePaymentSettingsInput"
      responses:
        "200":
          description: Updated online payment availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlinePaymentSettings"
  /admin/billing/razorpay/active:
    put:
      operationId: setActiveRazorpayEnvironment
      tags: [billing]
      summary: Select the active Razorpay environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveRazorpayEnvironmentInput"
      responses:
        "200":
          description: Updated active environment and masked credential status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RazorpaySettings"
  /admin/billing/razorpay/test:
    post:
      operationId: testRazorpayConnection
      tags: [billing]
      summary: Verify saved Razorpay API credentials for one environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestRazorpayConnectionInput"
      responses:
        "200":
          description: Razorpay API connection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RazorpayTestResponse"
  /admin/billing/packages:
    get:
      operationId: listAdminSubscriptionPackages
      tags: [billing]
      summary: List all subscription packages for administration
      responses:
        "200":
          description: Subscription package catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPackageList"
    post:
      operationId: createSubscriptionPackage
      tags: [billing]
      summary: Create a subscription package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPackageInput"
      responses:
        "201":
          description: Created subscription package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPackage"
        "409":
          description: A zero-price package already exists
  /admin/billing/packages/{packageId}:
    patch:
      operationId: updateSubscriptionPackage
      tags: [billing]
      summary: Update a subscription package
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPackageUpdateInput"
      responses:
        "200":
          description: Updated subscription package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPackage"
        "409":
          description: A different zero-price package already exists
  /admin/billing/subscriptions/gift:
    post:
      operationId: giftAdminSubscription
      tags: [billing]
      summary: Grant a subscription term to a tenant account without collecting payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionGiftInput"
      responses:
        "201":
          description: Granted subscription term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionSummary"
        "400":
          description: Invalid gift request
        "404":
          description: Tenant account or subscription package not found
  /subscriptions/packages:
    get:
      operationId: listAvailableSubscriptionPackages
      tags: [billing]
      summary: List publicly visible subscription packages
      description: Returns active packages when package visibility is public. Does not require authentication.
      responses:
        "200":
          description: Active customer-facing subscription packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPackageList"
  /subscriptions/payment-availability:
    get:
      operationId: getSubscriptionPaymentAvailability
      tags: [billing]
      summary: Get online payment status and the platform contact address
      description: Requires an authenticated customer account. The contact address is the active superadmin email.
      responses:
        "200":
          description: Whether paid checkout is available and whom to contact if it is not
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPaymentAvailability"
  /subscriptions/current:
    get:
      operationId: getCurrentSubscription
      tags: [billing]
      summary: Get the authenticated customer's current subscription
      responses:
        "200":
          description: Current subscription, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSubscription"
  /subscriptions/free:
    post:
      operationId: activateFreeSubscription
      tags: [billing]
      summary: Activate a free package without creating a payment or Razorpay order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateFreeSubscriptionInput"
      responses:
        "200":
          description: Free subscription activated, scheduled, or already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeSubscriptionActivation"
        "400":
          description: Invalid free-package request
        "403":
          description: Email verification is required
        "404":
          description: Free package is not available
  /subscriptions/add-ons:
    get:
      operationId: getSubscriptionAddOns
      tags: [billing]
      summary: Get add-on eligibility, available packages, and persistent entitlement balances
      responses:
        "200":
          description: Add-on catalogue for eligible paid subscribers and current entitlement balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAddOnsDashboard"
  /subscriptions/add-ons/free:
    post:
      operationId: activateFreeAddOn
      tags: [billing]
      summary: Activate an eligible free add-on without creating a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateFreeAddOnInput"
      responses:
        "201":
          description: Free add-on entitlement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeAddOnActivation"
        "400":
          description: Invalid or already claimed free add-on
        "403":
          description: An active paid primary package is required
        "404":
          description: Free add-on package is unavailable
  /subscriptions/orders:
    post:
      operationId: createSubscriptionOrder
      tags: [billing]
      summary: Create a server-priced Razorpay order for a package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionOrderInput"
      responses:
        "201":
          description: Razorpay order and Checkout details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionOrderCreated"
        "400":
          description: Invalid package selection or a free package that must use direct activation
        "503":
          description: Online payments are disabled or Razorpay is not configured
  /subscriptions/verify:
    post:
      operationId: verifyRazorpayPayment
      tags: [billing]
      summary: Verify a Checkout response and confirm captured payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRazorpayPaymentInput"
      responses:
        "200":
          description: Payment verification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerificationResult"
  /webhooks/razorpay:
    post:
      operationId: receiveRazorpayWebhook
      tags: [billing]
      summary: Receive signed Razorpay payment events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RazorpayWebhookPayload"
      responses:
        "200":
          description: Webhook accepted or safely ignored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    MaintenanceStatus:
      type: object
      properties:
        maintenanceMode:
          type: boolean
      required: [maintenanceMode]
    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        earliestStartAt:
          type: ["string", "null"]
          format: date-time
      required: [error]
    SupportTicketStatus:
      type: string
      enum: [open, in_progress, waiting_on_customer, resolved, closed]
    SupportTicketSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        status: { $ref: "#/components/schemas/SupportTicketStatus" }
        createdAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time }
      required: [id, subject, status, createdAt, lastMessageAt]
    AdminSupportTicketSummary:
      allOf:
        - $ref: "#/components/schemas/SupportTicketSummary"
        - type: object
          properties:
            requesterFirstName: { type: string }
            requesterLastName: { type: string }
            requesterEmail: { type: string, format: email }
          required: [requesterFirstName, requesterLastName, requesterEmail]
    SupportTicketMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        authorRole: { type: string, enum: [USER, SUPERADMIN] }
        authorName: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, ticketId, authorRole, authorName, message, createdAt]
    SupportTicketInput:
      type: object
      properties:
        subject: { type: string, minLength: 1, maxLength: 160 }
        message: { type: string, minLength: 1, maxLength: 10000 }
      required: [subject, message]
    SupportTicketMessageInput:
      type: object
      properties:
        message: { type: string, minLength: 1, maxLength: 10000 }
      required: [message]
    SupportTicketStatusUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/SupportTicketStatus" }
      required: [status]
    SupportTicketDetail:
      type: object
      properties:
        ticket: { $ref: "#/components/schemas/SupportTicketSummary" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/SupportTicketMessage" }
      required: [ticket, messages]
    AdminSupportTicketDetail:
      type: object
      properties:
        ticket: { $ref: "#/components/schemas/AdminSupportTicketSummary" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/SupportTicketMessage" }
      required: [ticket, messages]
    SupportTicketCollection:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SupportTicketSummary" }
      required: [items]
    AdminSupportTicketCollection:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminSupportTicketSummary" }
      required: [items]
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [SUPERADMIN, USER] }
        timezone: { type: string }
        active: { type: boolean }
        emailVerified: { type: boolean }
        mustChangeCredentials: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, username, firstName, lastName, email, role, timezone, active, emailVerified, mustChangeCredentials, createdAt]
    PasswordPolicy:
      type: object
      properties:
        passwordMinimumLength: { type: integer, minimum: 8, maximum: 128 }
      required: [passwordMinimumLength]
    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
      required: [user]
    LoginInput:
      type: object
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }
      required: [identifier, password]
    RegisterInput:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 256 }
      required: [firstName, lastName, email, password]
    VerifyEmailInput:
      type: object
      properties:
        email: { type: string, format: email }
        code: { type: string, minLength: 6, maxLength: 6 }
      required: [email, code]
    ForgotPasswordInput:
      type: object
      properties:
        email: { type: string, format: email }
      required: [email]
    ResetPasswordInput:
      type: object
      properties:
        token: { type: string, minLength: 32, maxLength: 256 }
        password: { type: string, minLength: 8, maxLength: 256 }
      required: [token, password]
    ChangePasswordInput:
      type: object
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 256 }
        newPassword: { type: string, minLength: 8, maxLength: 256 }
      required: [currentPassword, newPassword]
    ProfileUpdateInput:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 50 }
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        timezone: { type: string, minLength: 1, maxLength: 80 }
    UserDashboard:
      type: object
      properties:
        subscriptionStatus: { type: string, enum: [inactive, active, expired] }
        contacts: { type: integer }
        companies: { type: integer }
        activeLists: { type: integer }
        amountSpentByCurrency:
          type: array
          items: { $ref: "#/components/schemas/DashboardAmountByCurrency" }
        lifecycleStages:
          type: array
          items: { $ref: "#/components/schemas/DashboardContactSegment" }
        leadStatuses:
          type: array
          items: { $ref: "#/components/schemas/DashboardContactSegment" }
        campaigns:
          type: array
          items: { $ref: "#/components/schemas/DashboardCampaign" }
        setupStepsCompleted: { type: integer }
        setupStepsTotal: { type: integer }
      required: [subscriptionStatus, contacts, companies, activeLists, amountSpentByCurrency, lifecycleStages, leadStatuses, campaigns, setupStepsCompleted, setupStepsTotal]
    UserNotification:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        message: { type: string }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        readAt: { type: ["string", "null"], format: date-time }
      required: [id, title, message, startsAt, expiresAt, createdAt, readAt]
    UserNotificationsResponse:
      type: object
      properties:
        unread:
          type: array
          items: { $ref: "#/components/schemas/UserNotification" }
        history:
          type: array
          items: { $ref: "#/components/schemas/UserNotification" }
      required: [unread, history]
    UserNotificationReadResponse:
      type: object
      properties:
        notificationId: { type: string, format: uuid }
        readAt: { type: string, format: date-time }
      required: [notificationId, readAt]
    NotificationAudience:
      type: string
      enum: [broadcast, focused]
    AdminNotification:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        message: { type: string }
        audience: { $ref: "#/components/schemas/NotificationAudience" }
        enabled: { type: boolean }
        status: { type: string, enum: [scheduled, active, expired, disabled] }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        recipientCount: { type: integer, minimum: 0 }
        readCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
      required: [id, title, message, audience, enabled, status, startsAt, expiresAt, recipientCount, readCount, createdAt]
    AdminNotificationsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminNotification" }
      required: [items]
    AdminNotificationInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        message: { type: string, minLength: 1, maxLength: 5000 }
        audience: { $ref: "#/components/schemas/NotificationAudience" }
        recipientUserIds:
          type: array
          maxItems: 1000
          items: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
      required: [title, message, audience, recipientUserIds, startsAt, expiresAt]
    AdminNotificationStatusInput:
      type: object
      properties:
        enabled: { type: boolean }
      required: [enabled]
    DashboardAmountByCurrency:
      type: object
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        amountMinor: { type: integer, minimum: 0 }
      required: [currency, amountMinor]
    DashboardContactSegment:
      type: object
      properties:
        value: { type: string }
        count: { type: integer, minimum: 0 }
      required: [value, count]
    DashboardCampaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [queued, sending, completed] }
        recipients: { type: integer, minimum: 0 }
        queued: { type: integer, minimum: 0 }
        delivered: { type: integer, minimum: 0 }
        bounced: { type: integer, minimum: 0 }
        suppressed: { type: integer, minimum: 0 }
        unknown: { type: integer, minimum: 0 }
        attemptsThisHour: { type: integer, minimum: 0 }
        remainingThisHour: { type: integer, minimum: 0 }
        hourlyLimit: { type: integer, minimum: 1 }
        queuedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, status, recipients, queued, delivered, bounced, suppressed, unknown, attemptsThisHour, remainingThisHour, hourlyLimit, queuedAt, completedAt, updatedAt]
    TenantSendingSettings:
      type: object
      properties:
        provider: { type: string, enum: [google_workspace, gmail, microsoft_365, other] }
        host: { type: ["string", "null"] }
        port: { type: ["integer", "null"] }
        encryption: { type: ["string", "null"], enum: [none, ssl, tls, null] }
        username: { type: ["string", "null"] }
        credentialsConfigured: { type: boolean }
        fromName: { type: ["string", "null"] }
        fromEmail: { type: ["string", "null"] }
        replyTo: { type: ["string", "null"] }
        verified: { type: boolean }
        verifiedAt: { type: ["string", "null"], format: date-time }
        connectionCheckStatus: { type: ["string", "null"], enum: [success, failure, null] }
        connectionCheckAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: ["string", "null"], format: date-time }
      required: [provider, host, port, encryption, username, credentialsConfigured, fromName, fromEmail, replyTo, verified, verifiedAt, connectionCheckStatus, connectionCheckAt, updatedAt]
    TenantSendingAccount:
      allOf:
        - $ref: "#/components/schemas/TenantSendingSettings"
        - type: object
          properties:
            id: { type: string, format: uuid }
            isPrimary: { type: boolean }
            lastUsedAt: { type: ["string", "null"], format: date-time }
            activeCampaignCount: { type: integer, minimum: 0 }
          required: [id, isPrimary, lastUsedAt, activeCampaignCount]
    TenantSendingAccounts:
      type: object
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/TenantSendingAccount" }
        emailAccountLimit: { type: integer, minimum: 0 }
        configuredCount: { type: integer, minimum: 0 }
        overLimit: { type: boolean }
        scheduledDowngrade:
          oneOf:
            - type: object
              properties:
                startsAt: { type: string, format: date-time }
                packageName: { type: string }
                emailAccountLimit: { type: integer, minimum: 0 }
                accountIdsToKeep:
                  type: array
                  items: { type: string, format: uuid }
              required: [startsAt, packageName, emailAccountLimit, accountIdsToKeep]
            - type: "null"
      required: [accounts, emailAccountLimit, configuredCount, overLimit, scheduledDowngrade]
    TenantSendingAccountResponse:
      type: object
      properties:
        account: { $ref: "#/components/schemas/TenantSendingAccount" }
      required: [account]
    TenantSendingSettingsInput:
      type: object
      properties:
        provider: { type: string, enum: [google_workspace, gmail, microsoft_365, other] }
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        encryption: { type: string, enum: [none, ssl, tls] }
        username: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, maxLength: 512 }
        fromName: { type: string, minLength: 1, maxLength: 120 }
        fromEmail: { type: string, format: email }
        replyTo: { type: string, format: email }
      required: [provider, host, port, encryption, fromName, fromEmail]
    GmailMailboxConnection:
      type: object
      properties:
        configured: { type: boolean }
        redirectUri: { type: ["string", "null"] }
        connected: { type: boolean }
        emailAddress: { type: ["string", "null"], format: email }
        syncStatus:
          type: string
          enum: [disconnected, connected, reauthorization_required, history_expired, error]
