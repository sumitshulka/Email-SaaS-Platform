kind = "web"
previewPath = "/"
title = "Mailflow SaaS"
description = "A secure multi-tenant email sending SaaS for individual professionals, with tenant-isolated contact management, scheduled personalized campaigns, subscriptions, and superadmin operations."
version = "1.0.0"
id = "artifacts/mailflow-saas"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20633

[services.development]
run = "pnpm --filter @workspace/mailflow-saas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mailflow-saas", "run", "build" ]
serve = "static"
publicDir = "artifacts/mailflow-saas/dist/public"

[[services.production.rewrites]]
from = "/features"
to = "/features/index.html"

[[services.production.rewrites]]
from = "/features/"
to = "/features/index.html"

[[services.production.rewrites]]
from = "/pricing"
to = "/pricing/index.html"

[[services.production.rewrites]]
from = "/pricing/"
to = "/pricing/index.html"

[[services.production.rewrites]]
from = "/terms-and-conditions"
to = "/terms-and-conditions/index.html"

[[services.production.rewrites]]
from = "/terms-and-conditions/"
to = "/terms-and-conditions/index.html"

[[services.production.rewrites]]
from = "/privacy-policy"
to = "/privacy-policy/index.html"

[[services.production.rewrites]]
from = "/privacy-policy/"
to = "/privacy-policy/index.html"

[[services.production.rewrites]]
from = "/shipping-refund"
to = "/shipping-refund/index.html"

[[services.production.rewrites]]
from = "/shipping-refund/"
to = "/shipping-refund/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20633"
BASE_PATH = "/"
