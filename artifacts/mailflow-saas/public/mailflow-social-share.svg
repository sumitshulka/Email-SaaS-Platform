<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b32"/>
      <stop offset="0.58" stop-color="#0b2d50"/>
      <stop offset="1" stop-color="#0758a3"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42b6ff"/>
      <stop offset="1" stop-color="#087cf0"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff927d"/>
      <stop offset="1" stop-color="#f45d65"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#031326" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1110" cy="18" r="310" fill="#1472c2" opacity=".12"/>
  <circle cx="1105" cy="24" r="224" fill="none" stroke="#7bc8ff" stroke-width="1" opacity=".14"/>
  <circle cx="1105" cy="24" r="166" fill="none" stroke="#7bc8ff" stroke-width="1" opacity=".12"/>
  <path d="M0 534C220 455 397 584 615 522s378-157 585-83v191H0Z" fill="#031326" opacity=".18"/>

  <!-- Flowline mark -->
  <g transform="translate(74 70)">
    <path d="M4 43V10l24 24 24-24v33" fill="none" stroke="url(#blue)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 43h17c13 0 22-9 22-22V10" fill="none" stroke="#64c5ff" stroke-width="9" stroke-linecap="round"/>
    <path d="m82 20 9-10 10 9" fill="none" stroke="#64c5ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124" y="41" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-1.5">mailflow</text>
  </g>

  <text x="78" y="236" fill="#a9d8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3.4">EMAIL CAMPAIGNS, SIMPLIFIED</text>
  <text x="74" y="322" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif" font-size="67" font-weight="700" letter-spacing="-2.8">Your sender.</text>
  <text x="74" y="401" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif" font-size="67" font-weight="700" letter-spacing="-2.8">Your audience.</text>
  <text x="74" y="480" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif" font-size="67" font-weight="700" letter-spacing="-2.8">Your campaigns.</text>
  <text x="78" y="543" fill="#c0d4e8" font-family="DejaVu Sans, Arial, sans-serif" font-size="21">Simple tools. The email account you control.</text>

  <!-- Campaign card -->
  <g filter="url(#shadow)" transform="translate(777 162)">
    <rect width="344" height="332" rx="23" fill="#fff"/>
    <rect x="24" y="23" width="296" height="46" rx="12" fill="#f2f7fc"/>
    <circle cx="47" cy="46" r="6" fill="#f87973"/>
    <circle cx="67" cy="46" r="6" fill="#f3bf58"/>
    <circle cx="87" cy="46" r="6" fill="#60c58b"/>
    <text x="27" y="112" fill="#54718d" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CAMPAIGN WORKSPACE</text>
    <text x="27" y="151" fill="#102d4c" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700">A clear path to send</text>

    <rect x="25" y="177" width="294" height="57" rx="12" fill="#f5f9fd"/>
    <rect x="38" y="190" width="32" height="32" rx="9" fill="#e2f2ff"/>
    <path d="M46 200h16M46 206h16M46 212h10" stroke="#1688e8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="82" y="200" fill="#183652" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">Organize contacts</text>
    <text x="82" y="219" fill="#71859a" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Keep your audience in view</text>

    <rect x="25" y="246" width="294" height="57" rx="12" fill="#f5f9fd"/>
    <rect x="38" y="259" width="32" height="32" rx="9" fill="#fff0ed"/>
    <path d="M45 273h17m-6-6 6 6-6 6" fill="none" stroke="#f36c62" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="269" fill="#183652" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">Send with your SMTP</text>
    <text x="82" y="288" fill="#71859a" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Stay with the account you control</text>
  </g>

  <circle cx="1110" cy="526" r="8" fill="url(#coral)"/>
  <path d="M1080 526h-30c-12 0-22-10-22-22v-9" fill="none" stroke="#ff8878" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <path d="m1023 500 5-7 6 6" fill="none" stroke="#ff8878" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
